# Docker Compose para a Locadora RPG
# Uso: docker compose up --build
# Acesse: http://localhost:3000

services:
  web:
    build: .
    image: locadora-rpg:latest
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/rails/storage
      - ./log:/rails/log
      - ./tmp:/rails/tmp
    environment:
      RAILS_ENV: "production"
      SECRET_KEY_BASE: "locadora-rpg-secret-key-base-local"
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"